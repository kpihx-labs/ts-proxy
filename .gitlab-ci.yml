stages:
  - test
  - deploy

variables:
  DOCKER_IMAGE: "registry.gitlab.com/kpihx-labs/proxies/ts-proxy:latest"

run_tests:
  stage: test
  tags:
    - docker
  script:
    - make check

deploy_appliance:
  stage: deploy
  tags:
    - homelab
  only:
    - main
  script:
    - echo "🚀 Deploying Sovereign Appliance to Homelab..."
    # Build and Install locally on the runner host
    - make docker-install
    - echo "✅ Appliance deployed and shim linked."
    # Publish the appliance image (push needs write auth → CI_JOB_TOKEN, no local secret)
    - docker login registry.gitlab.com -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN"
    - make docker-publish
    - echo "✅ Appliance image published to $DOCKER_IMAGE."
